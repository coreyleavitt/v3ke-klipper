# Dependabot version-update configuration.
#
# NB: GitHub only recognises this file as `.github/dependabot.yml` (the `.yml`
# spelling) — `.yaml` is silently ignored here, unlike workflow files.
#
# Submodules (external/klipper, external/katapult, mainsail-config) are
# deliberately OMITTED: they are pinned to exact upstream commits as the
# reproducibility anchor and must not be bumped automatically. The Nim toolchain
# (tools/v3ke) is also omitted — Dependabot has no Nim ecosystem.
version: 2
updates:
  # GitHub Actions — keep the SHA-pinned `uses:` current and patched.
  # Dependabot preserves the pin style (updates the SHA and the `# vX.Y.Z`
  # comment together), so our supply-chain pinning convention is maintained.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  # Python dev/test tooling (uv-managed) under tools/.
  - package-ecosystem: "uv"
    directory: "/tools"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]

  # Cross-toolchain base image (digest-pinned openSUSE Tumbleweed) — tracks
  # base-image CVEs. Tumbleweed rolls frequently, so digest-bump PRs may be
  # regular; security_updates still flow regardless of this cadence.
  - package-ecosystem: "docker"
    directory: "/toolchain"
    schedule:
      interval: "weekly"
