name: Release

# Triggered on version tags (v*) to publish a new release, and on workflow_dispatch
# so a maintainer can dry-run the release pipeline on a test ref without pushing a
# real tag.
#
# The release pipeline:
#   1. Proves reproducibility (repro-gate via repro-check.sh).
#   2. Packages artifacts into the release zip (build.py release --reproducible).
#   3. Emits SHA256SUMS covering the zip + manifest.json.
#   4. Signs SHA256SUMS with cosign keyless (OIDC ambient credentials via id-token).
#   5. Creates a GitHub Release with --generate-notes and uploads all assets.
#
# The milestone proof (real tagged run producing live assets) is deferred until
# the operator commits + pushes a tag.  The local proof is the pytest RED gate
# (tools/tests/test_workflows_c3.py) and the `act --list` parse.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Default: deny all permissions.  The release job elevates only what it needs.
permissions: {}

# Prevent overlapping releases of the same tag (e.g. concurrent re-runs).
# Cancelling in-progress is acceptable here: a release for the same tag should
# not run twice — the second run would fail at --fail-if-exists anyway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build, sign, and publish release
    runs-on: ubuntu-latest

    # Least-privilege:
    #   contents: write  — create the GitHub Release and upload assets
    #   id-token: write  — cosign keyless OIDC signing (ambient credentials)
    #   packages: read   — pull the toolchain image from ghcr
    permissions:
      contents: write
      id-token: write
      packages: read

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout — full history + submodules
      #
      # fetch-depth: 0  — full history required for `git describe` (C1 versioning)
      #                   and SOURCE_DATE_EPOCH (reproducibility anchor).
      # submodules: recursive — external/klipper + external/katapult are the
      #                         source trees the orchestrator compiles; mainsail-config
      #                         is collected for license/provenance in the zip.
      # -----------------------------------------------------------------------
      - name: Checkout (full history + submodules)
        # actions/checkout v4.2.2 — SHA-pinned to prevent tag-mutation attacks.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: recursive

      # -----------------------------------------------------------------------
      # 2. Submodule integrity gate
      #
      # Asserts the checked-out submodule HEADs exactly match the gitlinks recorded
      # in the index (the pinned commits).  Same gate as in the test job in ci.yml.
      #
      #   + prefix → submodule HEAD differs from the pinned index commit
      #   - prefix → submodule not initialised
      #   U prefix → merge conflict inside the submodule
      #
      # A drift here means the cosign-signed SHA256SUMS would cover different source
      # than the pinned commit, breaking the reproducibility + supply-chain proof.
      # -----------------------------------------------------------------------
      - name: Submodule integrity gate
        run: |
          echo "--- git submodule status --recursive ---"
          git submodule status --recursive
          bad=$(git submodule status --recursive | grep -E '^\s*[+\-U]' || true)
          if [ -n "$bad" ]; then
            echo "ERROR: submodule(s) out-of-sync with pinned index commits:"
            echo "$bad"
            echo ""
            echo "  '+' = checked-out commit differs from index (stale or rebased upstream)"
            echo "  '-' = submodule not initialized"
            echo "  'U' = merge conflict inside submodule"
            echo ""
            echo "Fix: git submodule update --init --recursive  (then commit the result)"
            exit 1
          fi
          echo "OK: all submodules match their pinned commits."

      # -----------------------------------------------------------------------
      # 3. Resolve toolchain image ref from toolchain/IMAGE_DIGEST
      #
      # The digest is sourced from a repo-tracked file (format: sha256:<64-hex>).
      # Pulling by digest guarantees the release uses exactly the image that was
      # verified by the B4 reproducibility proof.
      #
      # continue-on-error: true — the inline-build fallback step (below) handles
      # the case where the digest is still a placeholder or ghcr is unavailable.
      # -----------------------------------------------------------------------
      - name: Pull toolchain image by digest
        id: pull
        run: |
          DIGEST=$(grep -E '^sha256:[0-9a-f]{64}$' toolchain/IMAGE_DIGEST | head -1)
          if [ -z "$DIGEST" ]; then
            echo "ERROR: no valid sha256: line found in toolchain/IMAGE_DIGEST" >&2
            exit 1
          fi
          IMAGE_REF="ghcr.io/coreyleavitt/v3ke-toolchain@${DIGEST}"
          echo "Pulling ${IMAGE_REF} ..."
          docker pull "${IMAGE_REF}"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      # -----------------------------------------------------------------------
      # Inline-build fallback: if the digest pull fails (placeholder digest, ghcr
      # unavailable), build the toolchain image locally from source.
      # Warning: an inline toolchain build takes ~20-40 min.
      # -----------------------------------------------------------------------
      - name: Build toolchain image inline (fallback — pull failed or digest not set)
        if: steps.pull.outcome == 'failure'
        id: fallback
        run: |
          echo "WARNING: digest pull failed — building toolchain image inline from toolchain/Containerfile"
          docker build \
            -t ghcr.io/coreyleavitt/v3ke-toolchain:release-fallback \
            -f toolchain/Containerfile \
            toolchain/
          echo "image_ref=ghcr.io/coreyleavitt/v3ke-toolchain:release-fallback" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # 4. Repro gate — double-build + sha256 comparison
      #
      # scripts/repro-check.sh runs the full build twice and asserts byte-identical
      # sha256 across both runs.  Exits non-zero if any artifact diverges.
      # If this step fails, the job stops here — we never package or release a
      # non-reproducible build.
      # -----------------------------------------------------------------------
      - name: Repro gate (double-build + sha256 compare)
        run: |
          if [ "${{ steps.pull.outcome }}" = "success" ]; then
            IMAGE_REF="${{ steps.pull.outputs.image_ref }}"
          else
            IMAGE_REF="${{ steps.fallback.outputs.image_ref }}"
          fi
          echo "Running repro-check.sh with image: ${IMAGE_REF}"
          bash scripts/repro-check.sh --runtime docker --image "${IMAGE_REF}"

      # -----------------------------------------------------------------------
      # 5. Capture toolchain versions
      #
      # ct-build emit-versions prints toolchain component versions as JSON.
      # Redirected to toolchain-versions.json, then passed to build.py release
      # via --toolchain-versions so the version info is embedded in manifest.json.
      # -----------------------------------------------------------------------
      - name: Capture toolchain versions
        run: |
          if [ "${{ steps.pull.outcome }}" = "success" ]; then
            IMAGE_REF="${{ steps.pull.outputs.image_ref }}"
          else
            IMAGE_REF="${{ steps.fallback.outputs.image_ref }}"
          fi
          docker run --rm "${IMAGE_REF}" ct-build emit-versions > toolchain-versions.json
          echo "Toolchain versions:"
          cat toolchain-versions.json

      # -----------------------------------------------------------------------
      # 6. Package — build.py release
      #
      # Produces dist/v3ke-<version>-linux-amd64.zip + dist/manifest.json.
      # --reproducible is justified: the repro gate (step 4) proved byte-identical
      # output across two independent cold builds.
      # -----------------------------------------------------------------------
      - name: Package release zip
        run: |
          if [ "${{ steps.pull.outcome }}" = "success" ]; then
            IMAGE_REF="${{ steps.pull.outputs.image_ref }}"
          else
            IMAGE_REF="${{ steps.fallback.outputs.image_ref }}"
          fi
          python3 tools/build.py \
            --runtime docker \
            --image "${IMAGE_REF}" \
            release \
            --reproducible \
            --toolchain-versions toolchain-versions.json

      # -----------------------------------------------------------------------
      # 7. SHA256SUMS — compute checksums over all release assets
      #
      # Covers the zip AND manifest.json so the cosign signature (step 9)
      # transitively authenticates the build provenance record.
      # -----------------------------------------------------------------------
      - name: Compute SHA256SUMS
        run: |
          cd dist
          sha256sum v3ke-*-linux-amd64.zip manifest.json > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      # -----------------------------------------------------------------------
      # 8. Install cosign
      #
      # sigstore/cosign-installer makes the cosign binary available on PATH.
      # SHA-pinned to v3.7.0.
      # -----------------------------------------------------------------------
      - name: Install cosign
        # sigstore/cosign-installer v3.7.0 — SHA-pinned.
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      # -----------------------------------------------------------------------
      # 9. Sign SHA256SUMS with cosign keyless
      #
      # Uses ambient OIDC credentials (id-token: write) via GitHub Actions'
      # OIDC provider.  Produces SHA256SUMS.sig.
      #
      # THIS STEP MUST NOT BE continue-on-error.  Signing failure aborts the
      # release — releasing unsigned assets is not permitted.
      # -----------------------------------------------------------------------
      - name: Sign SHA256SUMS (cosign keyless)
        run: |
          cosign sign-blob \
            --yes \
            --output-signature dist/SHA256SUMS.sig \
            dist/SHA256SUMS

      # -----------------------------------------------------------------------
      # 10. Determine pre-release flag
      #
      # Tags matching v0.* are pre-1.0 releases and must be marked as pre-releases
      # on GitHub so consumers know they are not stable.
      # -----------------------------------------------------------------------
      - name: Determine pre-release status
        id: prerelease
        run: |
          TAG="${GITHUB_REF_NAME}"
          if echo "${TAG}" | grep -qE '^v0\.'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} matches v0.* — marking as pre-release."
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} does not match v0.* — marking as full release."
          fi

      # -----------------------------------------------------------------------
      # 11. Create GitHub Release and upload assets
      #
      # --generate-notes: auto-generates a changelog from merged PRs since the
      #                   previous tag.
      # --fail-if-exists: idempotency guard — prevents silently overwriting an
      #                   existing release if the tag is accidentally re-pushed.
      # --prerelease:     set when the pre-release step output is 'true' (v0.*).
      # Assets uploaded: zip, SHA256SUMS, SHA256SUMS.sig, manifest.json.
      # -----------------------------------------------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ steps.prerelease.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            --fail-if-exists \
            ${PRERELEASE_FLAG} \
            dist/v3ke-*-linux-amd64.zip \
            dist/SHA256SUMS \
            dist/SHA256SUMS.sig \
            dist/manifest.json
