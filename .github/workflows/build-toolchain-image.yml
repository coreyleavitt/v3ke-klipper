name: Build & Push Toolchain Image

# Triggered on changes to the cross-toolchain definition or this workflow file (to catch
# misconfigurations early), and on manual dispatch for out-of-band rebuilds.
#
# Toolchain builds are expensive (~20–40 min) so the push trigger is path-scoped; routine
# changes to tools/, docs/, etc. do not trigger an image rebuild.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'toolchain/**'
      - '.github/workflows/build-toolchain-image.yml'

# Default: no permissions. The job below elevates only what it needs.
permissions: {}

jobs:
  build-push:
    name: Build and push v3ke-toolchain image
    runs-on: ubuntu-latest

    # Least-privilege: write to ghcr for the push, read-only on repo contents for checkout.
    # No other scopes (no id-token, no statuses, etc.).
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        # actions/checkout v4.2.2 — pinned to commit SHA to prevent tag mutation attacks.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # ghcr package visibility is set at the repository/package level, not in the workflow.
      # Before the first push: go to github.com/<owner> → Packages → v3ke-toolchain →
      # Package settings → Change visibility → Public.  This is a one-time manual step; the
      # workflow itself has no mechanism to set it.
      - name: Log in to GitHub Container Registry
        # docker/login-action v3.3.0 — SHA-pinned.
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v3.8.0 — SHA-pinned.
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca

      - name: Build and push toolchain image
        id: build
        # docker/build-push-action v6.11.0 — SHA-pinned.
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355
        with:
          context: toolchain/
          file: toolchain/Containerfile
          push: true
          # Two tags: a moving :latest for convenience and an immutable commit-SHA tag for
          # reproducible references (use the SHA tag in B3's pull-by-digest step).
          tags: |
            ghcr.io/coreyleavitt/v3ke-toolchain:latest
            ghcr.io/coreyleavitt/v3ke-toolchain:${{ github.sha }}
          # Disable GitHub Actions cache: the toolchain build's reproducibility guarantee
          # (B4) requires independent builds, not cache-reused layers.
          cache-from: ''
          cache-to: ''

      # Emit the pushed image digest as a step output AND to the job summary so downstream
      # workflows (B3) and operators can reference the exact image without relying on the
      # mutable :latest tag.
      - name: Report image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SHA_TAG: ghcr.io/coreyleavitt/v3ke-toolchain:${{ github.sha }}
        run: |
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          printf '## Toolchain image pushed\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '| Field | Value |\n|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          printf '| Digest | `%s` |\n' "${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          printf '| SHA tag | `%s` |\n' "${SHA_TAG}" >> "$GITHUB_STEP_SUMMARY"
          printf '| Pull command | `podman pull ghcr.io/coreyleavitt/v3ke-toolchain@%s` |\n' "${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
